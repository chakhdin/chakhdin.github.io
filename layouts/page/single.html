{{ define "main" }}
<div class="max-w-3xl mx-auto md:px-4 py-4 md:py-8">
    <header class="mb-8 md:mb-12">
        <h1 class="text-3xl sm:text-5xl md:text-6xl font-extrabold text-white mb-4 break-words">{{ .Title }}</h1>
        {{ with .Description }}
        <p class="text-lg md:text-xl text-gray-400">{{ . }}</p>
        {{ end }}
    </header>
    <div class="prose prose-invert md:prose-lg max-w-none min-w-0 break-words text-gray-300 leading-relaxed">
        {{ .Content }}
    </div>
</div>
{{ end }}
