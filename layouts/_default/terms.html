{{ define "main" }}
<h1 class="text-5xl font-extrabold mb-12 text-white border-b border-gray-800 pb-6">
    Browse by {{ if eq .Data.Plural "categories" }}Object Type{{ else }}Equipment{{ end }}
</h1>

<div class="flex flex-wrap gap-6">
    {{ range .Data.Terms.ByCount }}
    <a href="{{ .Page.RelPermalink }}" class="group bg-gray-800 hover:bg-blue-600 border border-gray-700 hover:border-blue-500 px-6 py-4 rounded-xl text-lg font-bold text-gray-200 hover:text-white transition-all duration-200 flex items-center shadow-lg hover:shadow-blue-900/50">
        {{ .Page.Title }} 
        <span class="ml-4 bg-gray-900 group-hover:bg-blue-800 text-blue-300 group-hover:text-blue-100 text-sm px-3 py-1 rounded-full border border-gray-700 group-hover:border-blue-700 transition-colors">
            {{ .Count }}
        </span>
    </a>
    {{ end }}
</div>
{{ end }}
