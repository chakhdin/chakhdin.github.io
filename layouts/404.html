{{ define "main" }}
<div class="flex flex-col items-center justify-center text-center py-24 px-6">
    <div class="text-blue-500 font-mono text-sm uppercase tracking-widest mb-6">404</div>
    <h1 class="text-4xl md:text-6xl font-extrabold text-white mb-6">{{ i18n "not_found_title" }}</h1>
    <p class="text-lg text-gray-400 max-w-xl mb-10">{{ i18n "not_found_message" }}</p>
    <a href="{{ site.Home.RelPermalink }}" class="inline-block bg-blue-900/50 hover:bg-blue-800 text-blue-200 border border-blue-700 px-6 py-3 rounded-lg font-semibold transition shadow-md">
        {{ i18n "back_home" }}
    </a>
</div>
{{ end }}
