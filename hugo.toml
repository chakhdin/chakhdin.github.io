baseURL = "https://sleepytelescope.com/"
locale = "en"
title = "Sleepy Telescope"
defaultContentLanguage = "en"
enableRobotsTXT = true
# lastmod (sitemap, RSS) from the last commit of each content file; CI needs full history.
enableGitInfo = true

[taxonomies]
  category = "categories"
  equipment = "equipment"

[markup]
  [markup.goldmark.renderer]
    unsafe = false

# Do not publish page-bundle resources (the original PNGs, ~600 MB) to the
# site output; only processed derivatives (webp/jpg) are referenced.
[cascade.build]
  publishResources = false

[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^npx$', '^postcss$', '^tailwindcss$']

[params]
  author = "Sergey Shakhdinarov"

  # Cloudflare Web Analytics beacon token, from the Cloudflare dashboard
  # (Analytics & Logs > Web Analytics > your site > "Manage Site" > snippet).
  # Leave empty to disable. Only loaded in production builds.
  cloudflareAnalyticsToken = ""

  # Public R2 base URL videos are served from directly (never synced into
  # Hugo/content — see scripts/r2-upload-video.mjs and scripts/r2-sync.mjs).
  # A page's `video` param is a key relative to this, e.g. "videos/jupiter/2025-02-05.mp4".
  videoBaseURL = "https://media.sleepytelescope.com"

[languages]
  [languages.en]
    label = "EN"
    weight = 1

  [languages.it]
    label = "IT"
    title = "Sleepy Telescope"
    weight = 2

  [languages.ru]
    label = "RU"
    title = "Sleepy Telescope"
    weight = 3
