baseURL = "https://chakhdin.github.io/"
locale = "en-us"
title = "Sergey's Astrophotography"
defaultContentLanguage = "en"

[taxonomies]
  category = "categories"
  equipment = "equipment"

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^npx$', '^postcss$', '^tailwindcss$']

[params]
  author = "Sergey Shakhdinarov"

  # Cloudflare Web Analytics beacon token, from the Cloudflare dashboard
  # (Analytics & Logs > Web Analytics > your site > "Manage Site" > snippet).
  # Leave empty to disable. Only loaded in production builds.
  cloudflareAnalyticsToken = ""

  # Public R2 base URL videos are served from directly (never synced into
  # Hugo/content — see scripts/r2-upload-video.mjs and scripts/r2-sync.mjs).
  # A page's `video` param is a key relative to this, e.g. "videos/jupiter/2025-02-05.mp4".
  videoBaseURL = "https://pub-31bf1763ca934d78aa1296ab64e4629e.r2.dev"

[languages]
  [languages.en]
    label = "EN"
    weight = 1

  [languages.it]
    label = "IT"
    title = "Astrofotografia di Sergey"
    weight = 2

  [languages.ru]
    label = "RU"
    title = "Астрофотография Сергея"
    weight = 3
